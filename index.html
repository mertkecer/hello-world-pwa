
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable"
        content="yes">
  <meta name="apple-mobile-web-app-title"
        content="Hello PWA">

  <title>Sleep Story Player</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon"
        href="icon-180.png">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 60px 24px;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      background: #1e293b;
      border-radius: 20px;
      padding: 24px;
      max-width: 420px;
      margin: 30px auto;
    }

    h1 { font-size: 26px; }
    p { color: #94a3b8; }

    button, select {
      background: #334155;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 16px;
    }

    #playBtn {
      background: #6366f1;
      min-width: 130px;
      margin: 20px 0;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #818cf8;
    }

    .times {
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
      font-size: 13px;
    }

    #message {
      font-size: 13px;
    }
  </style>
</head>

<body>
  <h1>🎧 Sleep Story Player</h1>
  <p>My first PWA audio player</p>

  <div class="card">
    <h2>Rainy Night 🌧️</h2>
    <p>Offline Audio Test</p>

    <audio id="audio"
           src="rain.wav"
           preload="auto">
    </audio>

    <button id="playBtn">▶ Play</button>

    <input id="progress"
           type="range"
           min="0" max="100" value="0">

    <div class="times">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <p>Playback Speed</p>

    <select id="speed">
      <option value="0.75">0.75x</option>
      <option value="1" selected>1x</option>
      <option value="1.25">1.25x</option>
    </select>

    <p id="message">Ready to play</p>
  </div>

  <script>
    const audio =
      document.getElementById("audio");
    const playBtn =
      document.getElementById("playBtn");
    const progress =
      document.getElementById("progress");
    const speed =
      document.getElementById("speed");
    const message =
      document.getElementById("message");

    const savedSpeed = Number(
      localStorage.getItem("audioSpeed") || 1
    );

    let savedTime = Number(
      localStorage.getItem("audioTime") || 0
    );

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) {
        return "0:00";
      }

      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m + ":" +
        String(s).padStart(2, "0");
    }

    speed.value = String(savedSpeed);
    audio.playbackRate = savedSpeed;

    audio.addEventListener(
      "loadedmetadata", () => {
        const duration = audio.duration;

        if (Number.isFinite(duration)) {
          audio.currentTime = Math.min(
            Math.max(savedTime, 0),
            Math.max(duration - 0.1, 0)
          );

          document.getElementById(
            "duration"
          ).textContent = formatTime(duration);
        }
      }
    );

    playBtn.addEventListener(
      "click", async () => {
        if (audio.paused) {
          try {
            await audio.play();
            message.textContent = "Playing";
          } catch (error) {
            message.textContent =
              "Audio error: " + error.message;
          }
        } else {
          audio.pause();
        }
      }
    );

    audio.addEventListener("play", () => {
      playBtn.textContent = "⏸ Pause";
    });

    audio.addEventListener("pause", () => {
      playBtn.textContent = "▶ Play";
    });

    audio.addEventListener("ended", () => {
      savedTime = 0;
      localStorage.setItem("audioTime", "0");
      progress.value = 0;
      message.textContent = "Finished";
    });

    audio.addEventListener(
      "timeupdate", () => {
        if (
          Number.isFinite(audio.duration) &&
          audio.duration > 0
        ) {
          progress.value =
            audio.currentTime /
            audio.duration * 100;
        }

        document.getElementById(
          "currentTime"
        ).textContent =
          formatTime(audio.currentTime);

        localStorage.setItem(
          "audioTime",
          String(audio.currentTime)
        );
      }
    );

    progress.addEventListener("input", () => {
      if (Number.isFinite(audio.duration)) {
        audio.currentTime =
          Number(progress.value) / 100 *
          audio.duration;
      }
    });

    speed.addEventListener("change", () => {
      audio.playbackRate = Number(speed.value);
      localStorage.setItem(
        "audioSpeed",
        speed.value
      );
    });

    audio.addEventListener("error", () => {
      message.textContent =
        "Could not load rain.wav";
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>
</body>
</html>
