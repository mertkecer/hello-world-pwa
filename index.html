
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable"
        content="yes">
  <meta name="apple-mobile-web-app-title"
        content="Hello PWA">
  <title>Sleep Story Player</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon"
        href="icon-180.png">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 45px 20px;
      background: #0f172a;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    h1, .subtitle {
      text-align: center;
    }

    h1 { font-size: 27px; }

    .subtitle {
      color: #94a3b8;
    }

    .card {
      background: #1e293b;
      border-radius: 20px;
      padding: 24px;
      max-width: 450px;
      margin: 30px auto;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #cbd5e1;
    }

    textarea {
      width: 100%;
      min-height: 175px;
      padding: 15px;
      border: 1px solid #475569;
      border-radius: 12px;
      background: #0f172a;
      color: white;
      font-size: 16px;
      resize: vertical;
    }

    select {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      background: #334155;
      color: white;
      border: none;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 15px 10px;
      border: none;
      border-radius: 12px;
      color: white;
      background: #6366f1;
      font-size: 16px;
    }

    #stopBtn {
      background: #475569;
    }

    #status {
      color: #94a3b8;
      text-align: center;
      font-size: 13px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <h1>🎙️ Sleep Story Studio</h1>
  <p class="subtitle">Your first AI narration test</p>

  <div class="card">
    <label for="story">Story Text</label>

    <textarea id="story">King's Landing...
A city of gold, ambition, and whispered secrets.

I remember the days when we fought for this kingdom.

Ned Stark stood beside me, and the world seemed simpler then.

But a crown is a heavy thing.

And sometimes, in the quiet of the night, I wonder whether we truly won anything at all.</textarea>

    <label for="voice">English Narrator</label>
    <select id="voice">
      <option value="">Default English Voice</option>
    </select>

    <label for="speed">Narration Speed</label>
    <select id="speed">
      <option value="0.7">0.7x - Very Slow</option>
      <option value="0.85" selected>0.85x - Sleep Mode</option>
      <option value="1">1x - Normal</option>
    </select>

    <div class="buttons">
      <button id="playBtn">▶ Speak</button>
      <button id="stopBtn">■ Stop</button>
    </div>

    <p id="status">Ready to narrate</p>
  </div>

  <script>
    const synth = window.speechSynthesis;
    const story = document.getElementById("story");
    const voiceSelect = document.getElementById("voice");
    const speed = document.getElementById("speed");
    const status = document.getElementById("status");

    let voices = [];

    function loadVoices() {
      voices = synth.getVoices().filter(
        v => v.lang.toLowerCase().startsWith("en")
      );

      voiceSelect.innerHTML = "";

      if (voices.length === 0) {
        const option = document.createElement("option");
        option.textContent = "Default English Voice";
        option.value = "";
        voiceSelect.appendChild(option);
        return;
      }

      voices.forEach((voice, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent =
          voice.name + " (" + voice.lang + ")";
        voiceSelect.appendChild(option);
      });
    }

    loadVoices();

    if ("onvoiceschanged" in synth) {
      synth.onvoiceschanged = loadVoices;
    }

    document.getElementById("playBtn")
      .addEventListener("click", () => {
        synth.cancel();

        const text = story.value.trim();

        if (!text) {
          status.textContent = "Enter some text first.";
          return;
        }

        const utterance =
          new SpeechSynthesisUtterance(text);

        utterance.lang = "en-GB";
        utterance.rate = Number(speed.value);
        utterance.pitch = 0.85;

        const selected = voices[
          Number(voiceSelect.value)
        ];

        if (selected) {
          utterance.voice = selected;
          utterance.lang = selected.lang;
        }

        utterance.onstart = () => {
          status.textContent = "Narrating...";
        };

        utterance.onend = () => {
          status.textContent = "Narration finished.";
        };

        utterance.onerror = (event) => {
          if (event.error !== "canceled") {
            status.textContent =
              "Speech error: " + event.error;
          }
        };

        synth.speak(utterance);
      });

    document.getElementById("stopBtn")
      .addEventListener("click", () => {
        synth.cancel();
        status.textContent = "Stopped.";
      });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>
</body>
</html>
